[project]
name = "python-fastapi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

# The import package is always `app`; only the project name above changes when
# the project is renamed, so imports, `just dev` and the Dockerfile never do.
[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "ERA",
  "T20", "S", "BLE", "DTZ", "G", "LOG", "PT", "ASYNC", "FAST", "TID", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
disallow_any_explicit = true
enable_error_code = ["explicit-override", "possibly-undefined", "truthy-bool", "unused-awaitable"]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
